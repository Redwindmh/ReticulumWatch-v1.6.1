[platformio]
default_envs = twatch_s3_16mb
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = fatfs
extra_scripts = pre:scripts/build_epoch.py

build_unflags =
    -std=gnu++11
    -fno-exceptions
build_flags =
    -std=gnu++17
    -fexceptions
    -D CORE_DEBUG_LEVEL=3
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_32=1
    -D LV_FONT_MONTSERRAT_48=1
    -D LV_USE_QRCODE=1
    -D ARDUINO_T_WATCH_S3
    -D ARDUINO_LILYGO_LORA_SX1262
    -I variants/lilygo_twatch_s3
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
    -D RW_MILESTONE=161
    -D BOARD_HAS_PSRAM=1
    -D RNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
    -D RNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
    ; microStore 0.1.7 gates Adapters::NoopFileSystem behind this macro.
    -D USTORE_USE_NOOPFS=1
    ; microReticulum 0.5.0 defaults include optional FS/provisioning features.
    ; RnsBuildConfig.h force-disables those features for this endpoint so the
    ; M1.4 security rebase does not silently change persistence architecture.
    -I src/config
    -include RnsBuildConfig.h
    -D MSGPACK_USE_BOOST=OFF
    -D RNS_KNOWN_DESTINATIONS_MAX=48
    -D RNS_HASHLIST_MAX=32
    -D RNS_RECEIPTS_MAX=8
    -D RNS_QUEUED_ANNOUNCES_MAX=8
    -D RNS_RANDOM_BLOBS_MAX=8
    -D RNS_RANDOM_BLOBS_PERSIST_MAX=4
    -D RNS_RATE_TIMESTAMPS_MAX=4
    -D RNS_PR_TAGS_MAX=8

lib_deps =
    xinyuan-lilygo/LilyGoLib @ 0.2.0
    lvgl/lvgl @ 9.4.0
    jgromes/RadioLib @ 7.4.0
    lewisxhe/XPowersLib @ 0.3.1
    lewisxhe/SensorLib @ 0.3.3
    mikalhart/TinyGPSPlus @ 1.1.0
    https://github.com/tonhuisman/IRremoteESP8266/archive/refs/heads/feature/C++20-compatibility.zip
    ; Keep the protocol-adjacent dependencies explicit and reproducible.
    bblanchon/ArduinoJson @ 7.4.2
    hideakitai/MsgPack @ 0.4.2
    ; M10 retains the M9 voice codec layer (outbound AM_CODEC2_700C, legacy 450 playback / field 0x07).
    sh123/esp32_codec2 @ 1.0.7
    rweather/Crypto @ 0.4.0
    ; M1.4 security rebase: immutable registry release with the modern API
    ; boundary and corrected Identity::validate() lineage.
    attermann/microReticulum @ 0.5.0
    ; Explicitly pin the transitive filesystem abstraction used by 0.5.0.
    attermann/microStore @ 0.1.7

monitor_filters =
    default
    esp32_exception_decoder

[env:twatch_s3_16mb]
board = lilygo-t-watch-s3
board_build.partitions = partitions/reticulum_watch_16mb.csv
build_flags =
    ${env.build_flags}
    -D RW_EXPECTED_FLASH_MB=16

[env:twatch_s3_8mb]
board = lilygo-t-watch-s3-8m
board_build.partitions = partitions/reticulum_watch_8mb.csv
build_flags =
    ${env.build_flags}
    -D RW_EXPECTED_FLASH_MB=8
